name: Windows desktop
# Pull requests are checked once; pushes to other branches wait for their pull request.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # A newer push to the same pull request or branch cancels the run it replaces.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Fail-fast on Windows so a typecheck, unit/integration, or production CVE failure
  # does not wait for Forge make. The required check name stays `test` (see aggregator).
  checks:
    name: typecheck and test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm typecheck
      - run: pnpm test
  packaged:
    name: packaged
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm make
      - run: pnpm test:desktop
      - run: pnpm test:packaged
      - run: pnpm test:routines
      - run: pnpm test:skills
      - run: pnpm test:run-audit
      - run: pnpm test:findings
      - run: pnpm test:revisions
      - run: pnpm test:knowledge
      - run: pnpm test:harness
      - run: pnpm test:sidebar
      - run: pnpm test:i18n
  # Branch protection requires this exact check name. It is green only when both
  # Windows jobs succeeded, so packaged smokes stay required without a ruleset change.
  test:
    needs: [checks, packaged]
    if: ${{ always() && !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require typecheck, tests, audit and packaged smokes
        shell: bash
        run: |
          echo "checks=${{ needs.checks.result }}"
          echo "packaged=${{ needs.packaged.result }}"
          test "${{ needs.checks.result }}" = success
          test "${{ needs.packaged.result }}" = success

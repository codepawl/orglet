name: macOS desktop
# Dogfood packaging. This is not the required Windows `test` aggregator.
# Pull requests are checked once; pushes to other branches wait for their pull request.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: typecheck, test and make
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Import Developer ID certificate
        id: signing
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash scripts/ci-macos-import-signing.sh
      - name: Prepare notarize API key file
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set +x
          if [ -z "${APPLE_API_KEY_P8:-}" ]; then
            echo "App Store Connect API key is not set; notarize will run only if Apple ID secrets are complete."
            exit 0
          fi
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Make
        env:
          APPLE_SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm make
      - name: Verify signature, staple and Gatekeeper
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(out/Orglet-darwin-*/Orglet.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "expected one Orglet.app, found ${#apps[@]}"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          codesign --display --verbose=2 "${apps[0]}"
          # The runner is a real Mac, so it answers the question a download would: does Gatekeeper open this app?
          # Only a notarized build can pass, so this is a gate when notarization credentials exist and a note when they do not.
          if [ -n "${APPLE_API_KEY:-}" ] || { [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; }; then
            stapler validate "${apps[0]}"
            spctl --assess --type execute --verbose=4 "${apps[0]}"
          else
            echo "Notarization credentials are not set; signed but not notarized, so Gatekeeper is not checked."
          fi
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: orglet-macos-${{ steps.signing.outputs.enabled == 'true' && 'signed' || 'unsigned' }}-zip
          path: out/make/zip/darwin/**/*.zip
          if-no-files-found: error
          retention-days: 14

name: macOS desktop
# Dogfood packaging. This is not the required Windows `test` aggregator.
# Pull requests are checked once; pushes to other branches wait for their pull request.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: typecheck, test and make
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm make
      - uses: actions/upload-artifact@v4
        with:
          name: orglet-macos-unsigned-zip
          path: out/make/zip/darwin/**/*.zip
          if-no-files-found: error
          retention-days: 14

name: npm installer
# Publishes @codepawlhq/orglet (installer/npm), versioned like the release. The package downloads that release's
# Setup, so it carries no app code. It publishes through npm trusted publishing (OIDC, with provenance): no npm token
# lives in the repository or on a maintainer's machine. The trusted publisher (this repository and this workflow
# file) is set once in the package's settings on npmjs.com.
# release.yml starts this workflow with workflow_dispatch after it publishes a release: a release made with
# GITHUB_TOKEN never fires the release trigger, and npm matches its trusted publisher against the top-level
# workflow's file name, so this file must stay the one that runs, not a reusable workflow called from release.yml.
# The release trigger stays for a release published by hand. Rerun: Actions -> npm installer -> Run workflow.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose version to publish, for example v0.9.0
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-installer-${{ inputs.tag || github.event.release.tag_name }}
jobs:
  publish:
    name: publish @codepawlhq/orglet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # This job can publish to npm, so every action it runs is pinned to a commit, not a tag that can move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Decide whether this version still needs publishing
        id: check
        working-directory: installer/npm
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a vX.Y.Z tag"
            exit 1
          fi
          # The installer downloads this release's Setup, so there must be one.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG has no GitHub Release; the installer would have nothing to download"
            exit 1
          fi
          package=$(jq -r .name package.json)
          if [ "$(npm view "$package@$version" version 2>/dev/null || true)" = "$version" ]; then
            echo "::notice::$package@$version is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Use an npm that supports trusted publishing
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          # Trusted publishing needs npm 11.5.1 or later. The version is compared here instead of with a package fetched
          # at run time, and an older npm is replaced by one exact version: this job can publish, so it runs nothing unpinned.
          IFS=. read -r major minor patch <<< "$(npm --version)"
          if (( major < 11 || (major == 11 && (minor < 5 || (minor == 5 && patch < 1))) )); then
            npm install --global npm@11.21.0
          fi
          npm --version
      - name: Version the package like the release
        if: steps.check.outputs.publish == 'true'
        working-directory: installer/npm
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        working-directory: installer/npm
        run: npm publish --access public --provenance

name: Linux desktop
# Dogfood packaging, like the macOS workflow. This is not the required Windows `test` aggregator.
# Pull requests are checked once; pushes to other branches wait for their pull request.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: typecheck, test and make
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm make
      - uses: actions/upload-artifact@v4
        with:
          name: orglet-linux-zip
          path: out/make/zip/linux/**/*.zip
          if-no-files-found: error
          retention-days: 14
      # Three things the runner lacks and a desktop has: a screen, the unprivileged user
      # namespaces Electron's sandbox needs, and a keyring for API keys. All three are runner
      # facts, so none of them is worked around in the app.
      - name: Let Electron start on a headless runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb gnome-keyring dbus-x11
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Electron's safeStorage encrypts API keys through libsecret, which needs a running,
      # unlocked keyring. Without one the smoke never sees "API key saved". The empty password
      # unlocks a throwaway keyring that exists only for this job.
      - name: Smoke the app
        env:
          # Electron picks its password store from the desktop environment. Naming one keeps it
          # on libsecret, which is the keyring started on the next line.
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          dbus-run-session -- bash -c '
            echo "" | gnome-keyring-daemon --unlock --components=secrets
            xvfb-run --auto-servernum pnpm test:desktop
          '

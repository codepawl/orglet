name: npm UI kit
# Publishes @codepawlhq/orglet-ui (packages/orglet-ui) at the version in its package.json, when that version is not
# on npm yet. The kit is versioned on its own, apart from the app, so this runs by hand after a version bump has
# merged: Actions -> npm UI kit -> Run workflow, on main.
# It publishes through npm trusted publishing (OIDC, with provenance): no npm token lives in the repository or on a
# maintainer's machine. The trusted publisher (this repository and this workflow file) is set once in the package's
# settings on npmjs.com, after the first version was published by hand.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-ui
jobs:
  publish:
    name: publish @codepawlhq/orglet-ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # This job can publish to npm, so every action it runs is pinned to a commit, not a tag that can move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish only from main
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow on main, not $GITHUB_REF"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          registry-url: https://registry.npmjs.org
      - name: Decide whether this version still needs publishing
        id: check
        working-directory: packages/orglet-ui
        run: |
          set -euo pipefail
          package=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          if [ "$(npm view "$package@$version" version 2>/dev/null || true)" = "$version" ]; then
            echo "::notice::$package@$version is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Use an npm that supports trusted publishing, and the repository's pnpm
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          # Trusted publishing needs npm 11.5.1 or later. An older npm is replaced by one exact version, and pnpm is
          # installed at the exact version the repository uses: this job can publish, so it runs nothing unpinned.
          IFS=. read -r major minor patch <<< "$(npm --version)"
          if (( major < 11 || (major == 11 && (minor < 5 || (minor == 5 && patch < 1))) )); then
            npm install --global npm@11.21.0
          fi
          npm install --global pnpm@11.19.0
      - name: Build and check the package
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @codepawlhq/orglet-ui test
          pnpm --filter @codepawlhq/orglet-ui check:docs
          pnpm --filter @codepawlhq/orglet-ui build
          pnpm --filter @codepawlhq/orglet-ui check:package
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        working-directory: packages/orglet-ui
        run: npm publish --access public --provenance

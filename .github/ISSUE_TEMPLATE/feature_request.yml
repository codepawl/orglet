name: Feature request
description: Suggest something Orglet should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check [product direction](https://github.com/codepawl/orglet/blob/main/docs/product.md) first, including the "Not now" list, and the [user guide](https://github.com/codepawl/orglet/blob/main/docs/user-guide.md) in case it already exists. For anything larger than a small fix, open the issue before a pull request ([CONTRIBUTING](https://github.com/codepawl/orglet/blob/main/CONTRIBUTING.md)).
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the job or problem, not only the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
  - type: dropdown
    id: fit
    attributes:
      label: Who is it for?
      description: Orglet is built for one person on their own computer (see product direction).
      options:
        - Someone working alone (freelancer, creator, solo founder)
        - An everyday ChatGPT or Claude user who wants more structure
        - A team or company (probably "Not now"; say why it still fits)

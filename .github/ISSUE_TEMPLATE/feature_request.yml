name: Feature request
description: Suggest something Orglet should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check [product direction](https://github.com/codepawl/orglet/blob/main/docs/product.md) first, including the "Not now" list. For anything larger than a small fix, open the issue before a pull request ([CONTRIBUTING](https://github.com/codepawl/orglet/blob/main/CONTRIBUTING.md)).
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the job or problem, not only the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?

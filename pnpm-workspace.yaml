packages:
  - 'packages/*'
nodeLinker: hoisted
allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: true
  node-pty: false
  # Loaded by @microsoft/mxc-sdk; its prebuilt binary comes as an optional package, so nothing is compiled here.
  koffi: false
overrides:
  '@electron/node-gyp': '10.2.0-electron.2'
  # Security fixes for build-tool dependencies (Dependabot alerts); both are only used while packaging.
  tar: '7.5.22'
  tmp: '0.2.7'
  # GHSA-ch52-4w7c-c8xp (max-stale could hand out another user's cached response): every release up to 4.2.0 is
  # affected. 4.3.0 is the maintainer's release of 2026-10-04 from the upstream repository; it is exempt from the
  # minimum release age below so the fix is not held back. Only build tools use this package.
  'http-cache-semantics': '4.3.0'
  # extract-zip has no patched release for GHSA-jmr9-qjv8-65gv / GHSA-7pqw-9j4j-h8q3. Electron's own fork is a
  # drop-in replacement hardened against Zip Slip and symlink escapes; electron itself already uses it (COD-151).
  extract-zip: 'npm:@electron-internal/extract-zip@1.0.5'
  # GHSA-68fv-2mgg-jv7q: source-map-js before 1.2.2, reached through Tailwind, PostCSS and jsdom (build and tests only).
  source-map-js: '1.2.2'
  # GHSA-hp3w-g68c-fv3c: sprintf-js has no patched release. It came only through global-agent 3 (roarr), which
  # @electron/get loads to honour proxy variables while packaging; global-agent 4 has the same bootstrap() and no roarr.
  global-agent: '4.1.3'
minimumReleaseAgeExclude:
  - '@duckdb/node-api@1.5.5-r.5'
  - '@duckdb/node-bindings-darwin-arm64@1.5.5-r.5'
  - '@duckdb/node-bindings-darwin-x64@1.5.5-r.5'
  - '@duckdb/node-bindings-linux-arm64-musl@1.5.5-r.5'
  - '@duckdb/node-bindings-linux-arm64@1.5.5-r.5'
  - '@duckdb/node-bindings-linux-x64-musl@1.5.5-r.5'
  - '@duckdb/node-bindings-linux-x64@1.5.5-r.5'
  - '@duckdb/node-bindings-win32-arm64@1.5.5-r.5'
  - '@duckdb/node-bindings-win32-x64@1.5.5-r.5'
  - '@duckdb/node-bindings@1.5.5-r.5'
  - http-cache-semantics@4.3.0

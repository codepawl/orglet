<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- The logo is an orglet (COD-154; redrawn 2026-10-05 on the owner's pick): the Orglet bubble with bowed sides,
       the way the orglets' bodies are drawn, lit as a matte ball from the top left, with two capsule eyes that lean
       to the right. The in-app mark (.orglet-mark) is the same drawing in CSS. A faint light line follows the edge so
       the shape still separates from a dark taskbar. Regenerate icon.png, icon.ico and icon.icns with
       scripts/build-icon.cjs. -->
  <defs>
    <radialGradient id="ball" cx=".34" cy=".28" r=".85">
      <stop offset="0" stop-color="#5a5a5e"/>
      <stop offset=".45" stop-color="#232325"/>
      <stop offset="1" stop-color="#070708"/>
    </radialGradient>
  </defs>
  <path d="M8 .9C12.7.9 15.1 3.3 15.1 8S12.7 15.1 8 15.1H3.5C1.9 15.1.9 14.1.9 12.5V8C.9 3.3 3.3.9 8 .9z" fill="url(#ball)" stroke="#fff" stroke-opacity=".12" stroke-width=".3"/>
  <g transform="rotate(14 8.5 6)" fill="#fff">
    <rect x="5.9" y="4" width="2" height="4.2" rx="1"/>
    <rect x="9.1" y="4" width="2" height="4.2" rx="1"/>
  </g>
</svg>
